name: Python Playwright tests

# Example workflow: this package must be the repository root.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install browsers and Linux dependencies
        run: python -m playwright install --with-deps

      - name: Run all eight cases in three browsers
        run: >-
          python -m pytest
          --browser chromium --browser firefox --browser webkit
          --html=reports/report.html --self-contained-html

      - name: Upload test reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-playwright-results
          path: |
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: warn
